apiVersion: v1
kind: Service
metadata:
  name: plutus-enterprise
  labels:
    {{- include "zadig.microservice.plutus-enterprise.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zadig.microservice.plutus-enterprise.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: 28000
      targetPort: 28000